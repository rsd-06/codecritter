[package]
name = "codecritter"
version = "0.2.0"
description = "Open-source pixel desktop companion (Stitch & Yoda) for developers"
authors = ["rsd-06"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "codecritter_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
tiny_http = "0.12"
rand = "0.8"
parking_lot = "0.12"
dirs = "5"
toml_edit = "0.22"
notify = { version = "6", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = []
# T2c may use `notify` for the sync-folder watcher (2 s mtime polling is the fallback).
notify-watch = ["dep:notify"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
