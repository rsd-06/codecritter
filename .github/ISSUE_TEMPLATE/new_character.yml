name: New character
description: Propose a new critter
labels: ["character"]
body:
  - type: markdown
    attributes:
      value: "Characters are plain pixel-grid data. See docs/characters.md. Original characters are especially welcome."
  - type: input
    id: name
    attributes:
      label: Character name
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Look and personality
      description: Colours, shape, how it should react. Sketches welcome.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: This is an original character, or I understand fan characters may be declined
          required: true
