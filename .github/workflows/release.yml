name: Release

# Push a tag like v0.2.0 (or run manually) to build installers on all three OSes and attach them to a
# DRAFT GitHub Release (review it, then publish). Builds are UNSIGNED: no code-signing certificates are
# configured, so Windows SmartScreen and macOS Gatekeeper will warn on first launch (see README "Install").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis,msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - os: ubuntu-latest
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libxtst-dev libx11-dev libxi-dev libssl-dev libgtk-3-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-{0}', github.run_number) }}
          releaseName: 'CodeCritter v__VERSION__'
          releaseBody: 'Unsigned build: Windows SmartScreen / macOS Gatekeeper will warn on first launch. See the README for install notes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
