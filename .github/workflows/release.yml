name: Release

# Push a tag like v0.2.0 (or run manually) to build installers on all three OSes and attach them to a
# DRAFT GitHub Release (review it, then publish). Builds are UNSIGNED: no code-signing certificates are
# configured, so Windows SmartScreen and macOS Gatekeeper will warn on first launch (see README "Install").
# Update artifacts (.sig + latest.json) ARE signed with the maintainer's minisign key: repository secrets
# TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) must exist. Clients only see latest.json once the
# draft release is PUBLISHED (the updater endpoint is releases/latest/download/latest.json).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis,msi'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - os: ubuntu-latest
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libxtst-dev libx11-dev libxi-dev libssl-dev libgtk-3-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # Real macOS signing + notarization, only when the secrets exist. Exporting nothing keeps the ad-hoc identity
      # from tauri.conf.json (empty APPLE_* variables would make the bundler try to import an empty certificate).
      - name: Enable Apple signing and notarization (when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_var() { { echo "$1<<CC_EOF"; printf '%s
' "$2"; echo "CC_EOF"; } >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            export_var APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            export_var APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            export_var APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "macOS: Developer ID signing enabled"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              export_var APPLE_ID "$APPLE_ID"
              export_var APPLE_PASSWORD "$APPLE_PASSWORD"
              export_var APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "macOS: notarization enabled"
            else
              echo "macOS: notarization skipped (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not all set)"
            fi
          else
            echo "macOS: no Apple certificate secrets; building with the ad-hoc identity"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-{0}', github.run_number) }}
          releaseName: 'CodeCritter v__VERSION__'
          releaseBody: 'Windows is unsigned (SmartScreen warns); macOS is ad-hoc signed unless Developer ID secrets are set (Gatekeeper warns on first launch). See the README and docs/macos.md for install notes.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Check the macOS artifacts
        if: runner.os == 'macOS'
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          ls -R "$B" | head -30
          ls "$B"/dmg/*_universal.dmg "$B"/macos/*.app.tar.gz
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || ls "$B"/macos/*.app.tar.gz.sig
          codesign -dv --verbose=2 "$B"/macos/CodeCritter.app 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
