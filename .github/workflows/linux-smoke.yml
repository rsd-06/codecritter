name: Linux smoke

# Builds the .deb + AppImage on ubuntu-22.04 (oldest supported glibc), then installs / runs them in clean
# containers (ubuntu 22.04 / 24.04, debian 12, arch) under Xvfb + openbox and checks /v1/health, an
# always-on-top skip-taskbar overlay window and event ingestion; screenshots are uploaded as artifacts.
# A separate job builds the AUR package (codecritter-bin) with makepkg against a published release.
on:
  push:
    branches: ['platform/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libxtst-dev libx11-dev libxi-dev libssl-dev libgtk-3-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Rust tests (with the optional evdev backend)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features evdev
      - name: Bundle (.deb + AppImage)
        run: >
          npm run tauri -- build --bundles deb,appimage --features evdev
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', mode: deb }
          - { image: 'ubuntu:22.04', mode: appimage }
          - { image: 'ubuntu:24.04', mode: deb }
          - { image: 'ubuntu:24.04', mode: appimage }
          - { image: 'debian:12', mode: deb }
          - { image: 'debian:12', mode: appimage }
          - { image: 'archlinux:latest', mode: appimage }
    name: smoke (${{ matrix.image }}, ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: art
      - name: Run in container
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/w" -e MODE=${{ matrix.mode }} ${{ matrix.image }} sh /w/tools/linux-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: out
          if-no-files-found: ignore

  aur:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: makepkg -si against the v0.2.1 release assets, then run it
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/w" -e VERSION=0.2.1 archlinux:latest sh -c \
            'sh /w/tools/aur-test.sh && MODE=pkg sh /w/tools/linux-smoke.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-aur
          path: out
          if-no-files-found: ignore
