appId: dev.codecritter.app
productName: CodeCritter
npmRebuild: false
copyright: Copyright (c) 2026 rsd-06 (MIT)
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  - '!**/*.test.*'
  - '!docs/**'
  - '!tools/**'
  - '!src/**'
  - '!.github/**'
  - '!**/node_modules/*/{test,tests,__tests__,docs,example,examples}/**'
  - '!**/node_modules/.bin'
extraResources:
  - from: bin/critter-hook.mjs
    to: bin/critter-hook.mjs
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**
  - node_modules/koffi/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
  extendInfo:
    LSUIElement: true
    NSHumanReadableCopyright: MIT License
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  title: ${productName} ${version}
linux:
  icon: build/icon-512.png
  category: Development
  maintainer: rsd-06 <rsd-06@users.noreply.github.com>
  synopsis: Pixel desktop companion for developers
  target: [AppImage, deb]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: rsd-06
  repo: codecritter
  releaseType: draft
