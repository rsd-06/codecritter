appId: dev.codecritter.app
productName: CodeCritter
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: bin/critter-hook.mjs
    to: bin/critter-hook.mjs
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**
  - node_modules/koffi/**
win:
  target: [nsis, portable]
mac:
  target: dmg
linux:
  target: [AppImage, deb]
